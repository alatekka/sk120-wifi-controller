name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FQBN: esp8266:esp8266:generic:eesz=1M64,FlashMode=dout
  CORE_URL: https://arduino.esp8266.com/stable/package_esp8266com_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$CORE_URL"
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls "$CORE_URL"
          arduino-cli lib install ArduinoMqttClient

      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" --additional-urls "$CORE_URL" --output-dir build firmware/SK120_Full
          mkdir -p dist
          cp build/SK120_Full.ino.bin dist/sk120-wifi-esp01.bin
          gzip -9 -c dist/sk120-wifi-esp01.bin > dist/sk120-wifi-esp01.bin.gz
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sk120-wifi-esp01
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .github/release-notes.md
